[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-trading"
version = "0.3.0"
description = "Evidence-linked trading decisions with local typed inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "OMNIA EYE Corporation"}]
dependencies = []

[project.optional-dependencies]
local = ["laya @ git+https://github.com/Omniaeye/omnia-laya.git@256eaf39550291dec7378d5a20078cc0d500e852"]

[project.scripts]
omnia-trading = "omnia_trading.cli:main"

[project.urls]
Repository = "https://github.com/Omniaeye/omnia-trading"
Documentation = "https://github.com/Omniaeye/omnia-trading/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnia_trading = ["*.json"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
